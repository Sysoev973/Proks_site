{{define "content"}}
  <main class="py-5">
    <div class="container">
      <div class="row g-4">
        <aside class="col-lg-3">
          <nav class="docs-nav list-group" aria-label="Документы">
            {{range .Data.Nav}}
            <a class="list-group-item list-group-item-action{{if .Active}} active{{end}}" href="{{.URL}}"
               {{- if .Active}} aria-current="page"{{end}}>{{.Title}}</a>
            {{end}}
          </nav>
        </aside>
        <article class="col-lg-9">
          <div class="doc-content">
            {{.Data.Content}}
          </div>
          <hr class="my-4">
          <a class="small" href="{{.Data.SourceURL}}">Открыть этот документ на GitHub</a>
        </article>
      </div>
    </div>
  </main>
{{end}}
