{{define "layout" -}}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <meta name="description" content="Proks — кэширующий HTTP-прокси на Go: TinyLFU, предзагрузка по цепям Маркова, инвалидация через RabbitMQ.">
  <script>
    // Тема ставится до загрузки CSS, иначе тёмная страница на миг мигает светлой.
    // Остальная логика переключателя — в static/js/theme.js.
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-bs-theme", t);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="{{.Base}}static/css/site.css" rel="stylesheet">
</head>
<body>
  <!-- В 5.3 navbar-dark устарел: тёмные цвета навбара и его меню задаёт data-bs-theme. -->
  <nav class="navbar navbar-expand-lg bg-dark sticky-top site-nav" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{.Base}}">Proks</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Открыть меню">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{.Base}}#about">О проекте</a></li>
          <li class="nav-item"><a class="nav-link" href="{{.Base}}#features">Возможности</a></li>
          <li class="nav-item"><a class="nav-link" href="{{.Base}}#architecture">Архитектура</a></li>
          <li class="nav-item">
            <a class="nav-link{{if eq .Active "docs"}} active{{end}}" href="{{.Base}}docs/"
               {{- if eq .Active "docs"}} aria-current="page"{{end}}>Документация</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{{if eq .Active "changelog"}} active{{end}}" href="{{.Base}}changelog/"
               {{- if eq .Active "changelog"}} aria-current="page"{{end}}>Изменения</a>
          </li>
          <li class="nav-item"><a class="nav-link" href="https://github.com/Sysoev973/Proks">GitHub</a></li>
          <li class="nav-item dropdown">
            <button class="btn btn-link nav-link dropdown-toggle" id="themeMenu" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false" aria-label="Тема оформления">
              <span class="theme-icon" aria-hidden="true">◐</span><span class="d-lg-none ms-2">Тема</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="themeMenu">
              <li><button class="dropdown-item" type="button" data-theme-value="light" aria-pressed="false">☀ Светлая</button></li>
              <li><button class="dropdown-item" type="button" data-theme-value="dark" aria-pressed="false">☾ Тёмная</button></li>
              <li><button class="dropdown-item" type="button" data-theme-value="auto" aria-pressed="false">◐ Как в системе</button></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  {{template "content" .}}

  <footer class="py-4 bg-dark text-white-50 site-footer">
    <div class="container d-flex flex-column flex-sm-row justify-content-between gap-2">
      <span>Proks</span>
      <span>
        <a class="link-light" href="https://github.com/Sysoev973/Proks">Proks на GitHub</a>
        ·
        <a class="link-light" href="https://github.com/Sysoev973/Proks_site">исходник сайта</a>
      </span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="{{.Base}}static/js/theme.js"></script>
</body>
</html>
{{end}}
