{{define "layout" -}}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <meta name="description" content="Proks — кэширующий HTTP-прокси на Go: TinyLFU, предзагрузка по цепям Маркова, инвалидация через RabbitMQ.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="{{.Base}}static/css/site.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{.Base}}">Proks</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Открыть меню">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{.Base}}#about">О проекте</a></li>
          <li class="nav-item"><a class="nav-link" href="{{.Base}}#features">Возможности</a></li>
          <li class="nav-item"><a class="nav-link" href="{{.Base}}#architecture">Архитектура</a></li>
          <li class="nav-item">
            <a class="nav-link{{if eq .Active "docs"}} active{{end}}" href="{{.Base}}docs/"
               {{- if eq .Active "docs"}} aria-current="page"{{end}}>Документация</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{{if eq .Active "changelog"}} active{{end}}" href="{{.Base}}changelog/"
               {{- if eq .Active "changelog"}} aria-current="page"{{end}}>Изменения</a>
          </li>
          <li class="nav-item"><a class="nav-link" href="https://github.com/Sysoev973/Proks">GitHub</a></li>
        </ul>
      </div>
    </div>
  </nav>

  {{template "content" .}}

  <footer class="py-4 bg-dark text-white-50">
    <div class="container d-flex flex-column flex-sm-row justify-content-between gap-2">
      <span>Proks</span>
      <span>
        <a class="link-light" href="https://github.com/Sysoev973/Proks">Proks на GitHub</a>
        ·
        <a class="link-light" href="https://github.com/Sysoev973/Proks_site">исходник сайта</a>
      </span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
{{end}}
